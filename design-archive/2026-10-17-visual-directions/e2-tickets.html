<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E2 Punch tickets</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  /* Each guess is a bus ticket stub: the card's paper, notched at the seam,
     its options printed in the game's colours. A pick is PUNCHED. */
  .sq { position: absolute; display: grid; gap: 0; padding: 6px; border-radius: 8%;
    background: linear-gradient(170deg, #fbf7ec, var(--card-paper) 60%, #ece3cf);
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 6px 12px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.5);
    -webkit-mask: radial-gradient(circle at 0 50%, transparent 6px, #000 6.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 6px, #000 6.5px) right / 51% 100% no-repeat;
            mask: radial-gradient(circle at 0 50%, transparent 6px, #000 6.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 6px, #000 6.5px) right / 51% 100% no-repeat; }
  .sq[data-key="hl"] { -webkit-mask: radial-gradient(circle at 50% 0, transparent 6px, #000 6.5px) top / 100% 51% no-repeat, radial-gradient(circle at 50% 100%, transparent 6px, #000 6.5px) bottom / 100% 51% no-repeat;
                               mask: radial-gradient(circle at 50% 0, transparent 6px, #000 6.5px) top / 100% 51% no-repeat, radial-gradient(circle at 50% 100%, transparent 6px, #000 6.5px) bottom / 100% 51% no-repeat; }
  .split-v { grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-rows: minmax(0,1fr); }
  .split-h { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) minmax(0,1fr); }
  .split-q { grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-rows: minmax(0,1fr) minmax(0,1fr); gap: 3px; }
  .seg { position: relative; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer; background: var(--fill);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18); }
  /* The perforation between options, printed in card ink. */
  .split-v .seg:first-of-type { border-right: 2px dashed rgba(var(--card-ink-rgb), 0.35); border-radius: 4px 0 0 4px; }
  .split-v .seg:nth-of-type(2) { border-radius: 0 4px 4px 0; }
  .split-h .seg:first-of-type { border-bottom: 2px dashed rgba(var(--card-ink-rgb), 0.35); border-radius: 4px 4px 0 0; }
  .split-h .seg:nth-of-type(2) { border-radius: 0 0 4px 4px; }
  .split-q .seg { border-radius: 3px; }
  .gl { width: 50%; color: var(--ink); display: grid; }
  .split-q .gl { width: 58%; }
  .gl svg { width: 100%; height: auto; }
  /* The conductor's punch: a clean hole through the paper to the table below. */
  .seg::after { content: ''; position: absolute; right: 12%; top: 12%; width: 22%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #3a200c, #1a0d05); box-shadow: inset 0 2px 2px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.35);
    transform: scale(0); transition: transform 120ms cubic-bezier(0.3, 1.6, 0.5, 1); }
  .split-q .seg::after { width: 26%; }
  .seg.on::after { transform: scale(1); }
  .punch-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--fill, #f7f2e6); pointer-events: none;
    animation: fall 520ms cubic-bezier(0.55, 0, 1, 0.45) forwards; }
  @keyframes fall { to { transform: translate(6px, 46px) rotate(120deg); opacity: 0; } }
  .eq { position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fbe7a6, #d6a733 55%, #8f6810); box-shadow: 0 2px 3px rgba(0,0,0,0.5); }
  .eq svg { width: 70%; }
  .seg { min-width: 0; min-height: 0; overflow: hidden; font: inherit; color: inherit; }
  .gl { aspect-ratio: 1; height: auto; max-height: 70%; }
  .gl svg { display: block; width: 100%; height: 100%; }
  .seg .chipmark { overflow: visible; }
  .split-v .seg:first-of-type .gl { transform: translateX(-16%); }
  .split-v .seg:nth-of-type(2) .gl { transform: translateX(16%); }
  .split-h .seg:first-of-type .gl { transform: translateY(-14%); }
  .split-h .seg:nth-of-type(2) .gl { transform: translateY(14%); }
  .eq { width: 24% !important; }
</style></head>
<body>
<div class="stage" id="s"><div class="layer bg" id="board"></div></div>
<script src="kit/kit.js"></script>
<script src="kit/guess.js"></script>
<script>
  const { g, place, el, size } = RTB;
  const s = document.getElementById('s');
  document.getElementById('board').style.backgroundImage = `url('kit/board-${size()}.webp')`;
  // The board's squares sit on a darker plate so the paper reads as laid on the table.
  GUESS.GUESSES.forEach((G, i) => { const n = el('div', '', GUESS.square(G)).firstElementChild; const r = g.squares[i];
    place(n, { x: r.x - 3, y: r.y - 3, w: r.w + 6, h: r.h + 6 }); n.style.transform = `rotate(${[-1.2, 0.8, -0.6, 1.1][i]}deg)`; s.appendChild(n); });
  GUESS.demo(s, (b) => {
    const r = b.getBoundingClientRect(), d = el('div', 'punch-dot');
    Object.assign(d.style, { left: (r.right - r.width * 0.23) + 'px', top: (r.top + r.height * 0.18) + 'px', background: getComputedStyle(b).backgroundColor });
    s.appendChild(d);
  });
</script>
</body></html>
