<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B1 The back room</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  /* A back room: walnut panelling to a brass rail, dark boards below, ONE lamp
     from the upper right (the table's own light). Still: nothing moves. */
  .room {
    background:
      radial-gradient(60% 55% at 76% 14%, rgba(255, 210, 140, 0.20), rgba(255, 190, 120, 0.06) 45%, transparent 70%),
      linear-gradient(180deg, transparent 0 33%, rgba(255, 215, 150, 0.32) 33.2%, rgba(120, 82, 30, 0.9) 33.6%, rgba(40, 24, 10, 0.9) 34.4%, transparent 34.6%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.38) 0 2px, rgba(255,220,170,0.035) 2px 4px, transparent 4px 132px),
      repeating-linear-gradient(90deg, rgba(255,240,220,0.012) 0 1px, transparent 1px 7px),
      linear-gradient(180deg, #2b1910 0%, #20120a 33%, #120a06 34.6%, #0b0604 100%);
  }
  .vignette { background: radial-gradient(85% 90% at 58% 46%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  .print { position: absolute; opacity: 0.55; }
  .table, .ui { background-size: 100% 100%; }
</style></head>
<body>
<div class="stage">
  <div class="layer room"></div>
  <svg class="print" id="print" viewBox="0 0 160 100" aria-hidden="true">
    <rect x="1" y="1" width="158" height="98" rx="2" fill="#1a110a" stroke="#6b4a1c" stroke-width="2"/>
    <rect x="9" y="9" width="142" height="82" fill="#d9ccb0" opacity="0.18"/>
    <path d="M20 70 C45 70 50 30 80 34 S118 66 140 30" fill="none" stroke="#d6a733" stroke-width="2.4" opacity="0.8"/>
    <g fill="#1a110a" stroke="#d6a733" stroke-width="1.6"><circle cx="20" cy="70" r="3.4"/><circle cx="52" cy="44" r="3.4"/><circle cx="80" cy="34" r="3.4"/><circle cx="110" cy="55" r="3.4"/></g>
    <circle cx="140" cy="30" r="5" fill="#d6a733"/>
  </svg>
  <div class="layer vignette"></div>
  <div class="layer table" id="table"></div>
  <div class="layer ui" id="ui"></div>
</div>
<script src="kit/kit.js"></script>
<script>
  const { size, g } = RTB, phone = size() === 'phone';
  RTB.table(document.getElementById('table'), true);
  document.getElementById('ui').style.backgroundImage = `url('kit/ui-${size()}.webp')`;
  Object.assign(document.getElementById('print').style, phone ? { left: '14px', top: '18px', width: '58px' } : { left: '64px', top: '40px', width: '150px' });
</script>
</body></html>
