<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H1 Illustrated guide</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  .veil { position: absolute; inset: 0; background: rgba(4,9,6,0.55); opacity: 0; transition: opacity 200ms; }
  .veil.in { opacity: 1; }
  .guide { position: absolute; left: 50%; top: 50%; width: min(720px, calc(100vw - 24px)); height: min(560px, calc(100vh - 110px)); display: flex; flex-direction: column;
    transform: translate(-50%, -46%) scale(0.96); opacity: 0; transition: transform 220ms var(--ease-out), opacity 200ms; overflow: hidden; }
  .guide.in { transform: translate(-50%, -52%); opacity: 1; }
  .gh { padding: 14px 16px 0; }
  .gh h4 { margin: 0 0 10px; font: 700 18px/1 var(--font-body); color: var(--ink-strong); display: flex; justify-content: space-between; }
  .gh h4 span:last-child { font-weight: 400; color: var(--ink-dim); }
  /* Sections as tabs that stay at the top: the player jumps to what they want. */
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; border-bottom: 1px solid var(--panel-edge); scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: none; color: var(--ink-body); font: 700 12.5px/1 var(--font-body); }
  .tabs button.on { background: rgb(76, 159, 254); border-color: transparent; color: #06182b; }
  .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 16px; scroll-behavior: smooth; }
  .scroll section { padding: 14px 0 6px; }
  .scroll h5 { margin: 0 0 8px; font: 800 16px/1.2 var(--font-body); color: var(--ink); }
  .scroll p { margin: 0 0 8px; font: 400 13.5px/1.5 var(--font-body); color: var(--ink-body); max-width: 66ch; }
</style></head>
<body>
<div class="stage" id="s"><div class="layer bg" id="board"></div><div class="veil" id="veil"></div></div>
<script src="kit/kit.js"></script><script src="kit/bar.js"></script><script src="kit/howto.js"></script>
<script>
  const { wait, loop, size, el } = RTB, s = document.getElementById('s');
  document.head.insertAdjacentHTML('beforeend', `<style>${HOWTO.CSS}</style>`);
  RTB.courts().then(() => {
    document.getElementById('board').style.backgroundImage = `url('kit/board-${size()}.webp')`;
    const g = el('div', 'guide panel', `<div class="gh"><h4><span>How to play</span><span>×</span></h4>
      <div class="tabs">${HOWTO.SECTIONS.map((x, i) => `<button data-t="${x.id}" class="${i ? '' : 'on'}">${x.tab}</button>`).join('')}</div></div>
      <div class="scroll">${HOWTO.SECTIONS.map((x) => `<section id="${x.id}"><h5>${x.title}</h5>${x.html}</section>`).join('')}</div>`);
    s.appendChild(g);
    const veil = document.getElementById('veil'), f = BAR.finger(s), sc = g.querySelector('.scroll');
    const go = async (id) => { const t = g.querySelector(`[data-t="${id}"]`), r = t.getBoundingClientRect(); await f.press(r.x + r.width / 2, r.y + r.height / 2);
      g.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === t)); sc.scrollTop = g.querySelector('#' + id).offsetTop - 4; };
    loop(9000, async () => {
      g.classList.remove('in'); veil.classList.remove('in'); sc.style.scrollBehavior = 'auto'; sc.scrollTop = 0; sc.style.scrollBehavior = '';
      g.querySelectorAll('.tabs button').forEach((b, i) => b.classList.toggle('on', i === 0));
      await wait(500);
      const [x, y] = BAR.centre('info'); await f.press(x, y); veil.classList.add('in'); g.classList.add('in');
      await wait(2200); await go('order'); await wait(1600); await go('modes'); await wait(2000);
      g.classList.remove('in'); veil.classList.remove('in');
    });
  });
</script>
</body></html>
