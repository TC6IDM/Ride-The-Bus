<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X1 Table rail</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  /* The bar becomes the table's own front rail: walnut, a brass inlay along its
     top edge, the controls set INTO it. The money sits in recessed wells, like
     the MODE sign; the deal disc sits in a brass bezel. */
  .xbar.rail { height: 92px; border-radius: 30px 30px 0 0;
    background: linear-gradient(180deg, transparent 0 3px, rgba(255,220,160,0.5) 3px 4px, transparent 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 11px),
      linear-gradient(180deg, #6b3a12, #4a280c 55%, #2f1806);
    box-shadow: 0 -2px 0 #b88a25, 0 -10px 24px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,220,170,0.25); }
  .rail .money, .rail .bet { padding: 8px 14px; border-radius: 10px; background: #0f0b08; box-shadow: inset 0 3px 8px rgba(0,0,0,0.85), 0 1px 0 rgba(255,220,170,0.18); }
  .rail .cap { color: rgba(242, 210, 122, 0.75); }
  .rail .g { color: #f2e6cf; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.6)); }
  .rail .deal { box-shadow: inset 0 0 0 3px #3d6b9e, 0 0 0 4px #b88a25, 0 0 0 5px #5a3f07, 0 6px 14px rgba(0,0,0,0.5); }
  @media (max-width: 600px) { .xbar.rail { height: 134px; border-radius: 22px 22px 0 0; } .rail .money { padding: 6px 10px; } .rail .bet { padding: 6px 10px; } }
</style></head>
<body>
<div class="stage" id="s"><div class="layer bg" id="board"></div></div>
<script src="kit/kit.js"></script><script src="kit/glyphs.js"></script><script src="kit/barmock.js"></script>
<script>
  document.getElementById('board').style.backgroundImage = `url('kit/board-nobar-${RTB.size()}.webp')`;
  BARMOCK.mount(document.getElementById('s'), 'rail');
</script>
</body></html>
