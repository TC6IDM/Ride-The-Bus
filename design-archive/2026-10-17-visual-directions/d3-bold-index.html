<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D3 Bold index</title>
<link rel="stylesheet" href="kit/kit.css">
</head>
<body>
<div class="stage" id="s"></div>
<script src="kit/kit.js"></script><script src="kit/faces.js"></script>
<script>
  /* Type leads: a bigger Big Shoulders 900 index under a crown-and-pip seal, pips
     a little smaller (0.21 of the width), a double frame in the card's colour. */
  const seal = (ink, rank, suit, inv) => `<g ${inv ? 'transform="rotate(180 100 149)"' : ''}>
      <text x="26" y="52" text-anchor="middle" font-family="Big Shoulders, sans-serif" font-weight="900" font-size="48" fill="${ink}">${rank}</text>
      ${RTB.pip(suit, 26, 70, 22, false)}
      ${RTB.crown(26, 92, 13, false)}</g>`;
  FACES.mount(document.getElementById('s'), {
    noIndex: true, pipScale: 0.9,
    under: (ink) => `<rect x="9" y="9" width="182" height="280" rx="9" fill="none" stroke="${ink}" stroke-opacity="0.55" stroke-width="1.4"/>
      <rect x="13" y="13" width="174" height="272" rx="7" fill="none" stroke="${ink}" stroke-opacity="0.25" stroke-width="0.8"/>`,
    over: (ink, deep, r, s) => seal(ink, r, s, false) + seal(ink, r, s, true),
  });
</script>
</body></html>
