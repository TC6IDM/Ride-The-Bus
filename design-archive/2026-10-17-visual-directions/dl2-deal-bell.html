<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DL2 Bus stop button</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  /* The bell push on a bus pole: a yellow housing, a red dome you press. The deal
     mark rides on the dome. Pressed, the dome sinks and a ring answers. */
  .bell { position: relative; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 45% 35%, #ffe27a, #f2c230 55%, #b98a12);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.55), inset 0 -3px 4px rgba(0,0,0,0.25), 0 6px 14px rgba(0,0,0,0.5); }
  .dome { position: absolute; inset: 16%; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, #ff7a68, #d42a3a 55%, #8a1020);
    box-shadow: 0 3px 0 #6a0a16, inset 0 2px 1px rgba(255,255,255,0.4); transition: transform 90ms, box-shadow 90ms; }
  .dome svg { width: 62%; height: 62%; }
  .down .dome { transform: translateY(2px); box-shadow: 0 1px 0 #6a0a16, inset 0 2px 3px rgba(0,0,0,0.35); }
  .ripple { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 rgba(255,226,122,0.7); pointer-events: none; }
  .down .ripple { animation: ring 600ms var(--ease-out); }
  @keyframes ring { to { box-shadow: 0 0 0 14px rgba(255,226,122,0); } }
</style></head>
<body>
<div class="stage" id="s"><div class="layer bg" id="board"></div></div>
<script src="kit/kit.js"></script><script src="kit/bar.js"></script><script src="kit/glyphs.js"></script><script src="kit/dealmock.js"></script>
<script>
  document.getElementById('board').style.backgroundImage = `url('kit/board-${RTB.size()}.webp')`;
  DEALMOCK.mount(document.getElementById('s'), () => `<div class="bell"><div class="ripple"></div><div class="dome">${GLYPHS.G.deal}</div></div>`, (n, d) => n.classList.toggle('down', d), 'Bus stop button');
</script>
</body></html>
