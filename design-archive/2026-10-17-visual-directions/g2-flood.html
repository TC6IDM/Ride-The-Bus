<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2 Flood heads</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="kit/rack.css">
<style>
  /* Closest to the reference's punch: the head is a flood of the family colour
     with dark ink, the card's top edge lit in the same tint. No outline. */
  .opt { box-shadow: var(--panel-elevation-low), inset 0 1px 0 rgba(var(--fam-rgb), 0.55); }
  .opt .top { padding: 13px 12px 10px; background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 60%), var(--fam);
    display: flex; flex-direction: column; align-items: center; gap: 7px; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18); }
  .opt .name { font: 900 26px/1 var(--font-display); color: var(--on-vol-ink); text-align: center; white-space: nowrap; }
  .opt .top .bolts svg { fill: var(--on-vol-ink) !important; }
  .opt .top .bolts svg[style*="255,240,220"] { fill: rgba(20, 17, 10, 0.25) !important; }
  .opt .top .bolts svg[style*="255, 240, 220"] { fill: rgba(20, 17, 10, 0.25) !important; }
  @media (max-width: 600px) {
    .opt .top { flex-direction: row; justify-content: space-between; padding: 10px 12px; }
    .opt .name { font-size: 24px; }
  }
</style></head>
<body>
<div class="stage" id="s"><div class="layer bg" id="board"></div></div>
<script src="kit/kit.js"></script><script src="kit/modes.js"></script><script src="kit/rack.js"></script>
<script>
  document.getElementById('board').style.backgroundImage = `url('kit/board-${RTB.size()}.webp')`;
  document.head.insertAdjacentHTML('beforeend', `<style>${MODES.CSS}</style>`);
  RACK.demo(document.getElementById('s'));
</script>
</body></html>
