<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- 64x64, not the full logo. This used to point at logo.png, which is
		     710x710 and 743 kB - a three-quarter-megabyte download on every cold
		     load, for a 16px tab icon, fetched before anything the player can
		     see. Same artwork, 10 kB. -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<title>Ride The Bus — Takeover Casino</title>
		<!-- No external stylesheet here. This used to load use.typekit.net, which
		     serves proxima-nova and brandon-grotesque - the SDK sample's fonts,
		     neither of which this game names anywhere. It cost two third-party
		     requests on every load and gave nothing back. Barlow and Big
		     Shoulders are self-hosted in components/app.css. -->
		<!-- No maximum-scale / user-scalable=no here, deliberately. Stake's
		     checklist asks for double-tap-to-zoom to be disabled on mobile, and
		     that is what those two used to buy - but they buy it by disabling
		     PINCH zoom as well, which fails WCAG 1.4.4. `touch-action:
		     manipulation` in app.css drops the double-tap gesture on its own and
		     leaves pinch alone, so the checklist item is met without taking
		     magnification away from anyone who needs it. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		%sveltekit.head%
	</head>
	<!-- The background here is the flash guard for the moment before any
	     stylesheet has loaded, which is why it is inline and a literal: a
	     var() cannot resolve before the token block exists. It is the felt's
	     darkest stop (--felt-edge) rather than black, so the first painted
	     frame is already the game's own colour. -->
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: #030d08">
		<div>%sveltekit.body%</div>
	</body>
</html>
