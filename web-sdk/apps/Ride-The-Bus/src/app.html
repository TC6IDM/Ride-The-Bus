<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- 64x64, not the full logo. This used to point at logo.png, which is
		     710x710 and 743 kB - a three-quarter-megabyte download on every cold
		     load, for a 16px tab icon, fetched before anything the player can
		     see. Same artwork, 10 kB. -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<title>Ride The Bus by Takeover Casino</title>
		<!-- No external stylesheet here. This used to load use.typekit.net, which
		     serves proxima-nova and brandon-grotesque - the SDK sample's fonts,
		     neither of which this game names anywhere. It cost two third-party
		     requests on every load and gave nothing back. -->
		<!-- THE FONTS ARE FILES, AND THEIR @font-face RULES LIVE HERE - not in
		     components/app.css, and never as data: URIs.

		     Stake Engine's CDN serves this page with
		       Content-Security-Policy: font-src 'self' https://fonts.gstatic.com
		     which refuses a font from a data: URI. config-vite sets
		     assetsInlineLimit: Infinity, so while these rules sat in app.css every
		     woff2 was base64'd into the page, and on the live site (front v71,
		     checked 2026-10-05) all six faces failed to load: the whole game drew
		     in fallback fonts and the console logged an error per face. Nothing
		     local could show it - the dev server and the local build send no CSP.

		     So the files ship from static/fonts/ (with their OFL licences, which
		     must travel with them) and are referenced through %sveltekit.assets%,
		     which SvelteKit writes as a path RELATIVE to this page. That matters:
		     the game is served from {team}.../{game}/v{N}/, so a root-relative
		     /fonts/... would miss. This template is not processed by Vite, so the
		     URLs stay URLs. The descriptors are game/ui/displayFace.ts's source of
		     truth - its test parses this file. The licence notes and the reasoning
		     behind both faces are in components/app.css.

		     Preloaded: the faces the loader and the board need first (Overpass latin,
		     Big Shoulders 700 and 900). The other three subsets download only if a
		     locale needs their characters, which unicode-range now does mean. -->
		<link rel="preload" href="%sveltekit.assets%/fonts/overpass-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/bigshoulders-latin-700.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/bigshoulders-latin-900.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face {
				font-family: 'Overpass';
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/overpass-latin.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Overpass';
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/overpass-latin-ext.woff2') format('woff2');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			@font-face {
				font-family: 'Overpass';
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/overpass-vietnamese.woff2') format('woff2');
				unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
			}
			@font-face {
				font-family: 'Overpass';
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/overpass-cyrillic.woff2') format('woff2');
				unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
			}
			@font-face {
				font-family: 'Big Shoulders';
				font-style: normal;
				font-weight: 700;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/bigshoulders-latin-700.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			@font-face {
				font-family: 'Big Shoulders';
				font-style: normal;
				font-weight: 900;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/bigshoulders-latin-900.woff2') format('woff2');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
		</style>
		<!-- No maximum-scale / user-scalable=no here, deliberately. Stake's
		     checklist asks for double-tap-to-zoom to be disabled on mobile, and
		     that is what those two used to buy - but they buy it by disabling
		     PINCH zoom as well, which fails WCAG 1.4.4. `touch-action:
		     manipulation` in app.css drops the double-tap gesture on its own and
		     leaves pinch alone, so the checklist item is met without taking
		     magnification away from anyone who needs it. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<!-- The game is dark, and says so before any stylesheet loads: the
		     browser draws its own parts - a native scrollbar, form controls,
		     the canvas behind the first frame - in their dark variants rather
		     than white. theme-color tints a phone's browser chrome to the same
		     felt the body starts on (--felt-edge, as a literal for the same
		     reason as the body's colour below). -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#030d08" />
		%sveltekit.head%
	</head>
	<!-- The background here is the flash guard for the moment before any
	     stylesheet has loaded, which is why it is inline and a literal: a
	     var() cannot resolve before the token block exists. It is the felt's
	     darkest stop (--felt-edge) rather than black, so the first painted
	     frame is already the game's own colour. The text colour is
	     --ink-strong, for the same reason: without it, anything printed before
	     the stylesheet arrives would be black on near-black. -->
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: #030d08; color: #ece6da">
		<div>%sveltekit.body%</div>
	</body>
</html>
