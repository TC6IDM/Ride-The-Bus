<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ride The Bus — math build</title>
<!--
  The page build_monitor.py serves. It polls /state twice a second and draws
  what came back; it holds no state of its own beyond the log cursor, so a
  refresh mid-build loses nothing and a tab opened late catches up in full.

  No external anything: a build runs on a machine that may be offline, and a
  monitor that needs a CDN to render is a monitor that fails when it is most
  wanted.
-->
<style>
  :root {
    --bg: #12131a;
    --panel: #191b24;
    --panel-2: #1f2230;
    --line: #2b2f40;
    --ink: #e7e9f2;
    --ink-dim: #8e94ac;
    --ink-faint: #616782;
    --accent: #6fa8ff;
    --done: #45c77a;
    --run: #ffb648;
    --warn: #ff6b6b;
    --sc: rgb(61, 220, 132);    /* --vol-sc   */
    --base: rgb(255, 201, 60);  /* --vol-base */
    --hs: rgb(255, 92, 92);     /* --vol-hs   */
    --tr: rgb(176, 106, 232);   /* --vol-tr   */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, #171923 0%, #13151d 100%);
    border-bottom: 1px solid var(--line);
    padding: 14px 18px 12px;
  }
  .title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
  .state-pill {
    font: 600 11px/1 var(--mono);
    letter-spacing: 0.08em;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--run);
    text-transform: uppercase;
  }
  .state-pill.done { color: var(--done); }
  .state-pill.failed { color: var(--warn); }
  .facts { margin-left: auto; display: flex; gap: 18px; font: 12px/1 var(--mono); color: var(--ink-dim); }
  .facts b { color: var(--ink); font-weight: 600; }

  .overall { margin-top: 12px; display: flex; align-items: center; gap: 14px; }
  .bar { position: relative; flex: 1; height: 10px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4f7fd6, var(--accent)); width: 0; transition: width 0.4s ease; }
  .bar.done > i { background: linear-gradient(90deg, #2f9c5f, var(--done)); }
  .pct { font: 600 13px var(--mono); min-width: 52px; text-align: right; }
  .eta { font: 12px var(--mono); color: var(--ink-dim); min-width: 150px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; padding: 14px 18px 24px; align-items: start; }
  .side { position: sticky; top: 92px; }
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; }
  }

  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; margin-bottom: 14px; }
  h2 { font: 600 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }

  /* ---- stages ---- */
  .stage { display: grid; grid-template-columns: 150px 1fr 90px 110px; align-items: center; gap: 10px; padding: 5px 0; }
  .stage + .stage { border-top: 1px solid #22252f; }
  .stage .name { font-weight: 600; }
  .stage .name small { display: block; font-weight: 400; color: var(--ink-faint); font-size: 11px; }
  .stage .count, .stage .stage-eta { font: 11px var(--mono); color: var(--ink-dim); text-align: right; }
  .stage.pending { opacity: 0.45; }
  .stage.running .name { color: var(--run); }
  .stage.done .name { color: var(--done); }

  /* ---- workers ---- */
  .workers { display: flex; flex-wrap: wrap; gap: 6px; }
  .worker {
    flex: 1 1 78px; min-width: 78px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 7px;
    background: var(--panel-2); font: 11px var(--mono); color: var(--ink-faint);
  }
  .worker .w-id { color: var(--ink-dim); }
  .worker.running { border-color: #6a4f17; background: #241d10; color: var(--run); }
  .worker.done { border-color: #1f5136; background: #12241a; color: var(--done); }
  .worker .w-val { display: block; font-size: 12px; margin-top: 2px; }

  /* ---- modes ---- */
  .family { margin-bottom: 14px; }
  .family-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .family-head h3 { margin: 0; font-size: 13px; letter-spacing: 0.04em; }
  .family-head .tally { font: 11px var(--mono); color: var(--ink-faint); }
  .family-head .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 5px; }
  .mode {
    border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2);
    padding: 5px 6px 6px; position: relative; overflow: hidden;
  }
  .mode .slug { font: 11px/1.25 var(--mono); color: var(--ink-dim); letter-spacing: 0.02em; }
  .mode .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; font: 10px var(--mono); color: var(--ink-faint); }
  .mode .steps { display: flex; gap: 3px; margin-top: 6px; }
  .mode .steps i { flex: 1; height: 4px; border-radius: 2px; background: #2c3040; }
  .mode .steps i:nth-child(1) { --step-ink: var(--sc); }
  .mode .steps i:nth-child(2) { --step-ink: var(--base); }
  .mode .steps i:nth-child(3) { --step-ink: var(--hs); }
  .mode .steps i:nth-child(4) { --step-ink: var(--tr); }
  .mode .steps i.done { background: var(--step-ink); }
  .mode .steps i.running { background: var(--step-ink); opacity: 0.5; animation: stepPulse 1.1s ease-in-out infinite; }
  .mode .steps i.warn { background: var(--warn); box-shadow: 0 0 0 1px rgba(255, 107, 107, 0.5); }
  @keyframes stepPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }
  .mode.active { border-color: var(--run); box-shadow: 0 0 0 1px rgba(255, 182, 72, 0.25); }
  .mode.finished .slug { color: var(--ink); }
  .mode.warn { border-color: var(--warn); }
  .mode .now { font: 10px var(--mono); color: var(--run); margin-top: 4px; min-height: 12px; }

  /* ---- log ---- */
  .log-wrap { height: min(46vh, 420px); overflow: auto; background: #0e0f15; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .log-line { font: 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--ink-dim); }
  .log-line.step { color: var(--accent); }
  .log-line.thread { color: #9fb2d8; }
  .log-line.warn { color: var(--run); }
  .log-line.error { color: var(--warn); }
  .log-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font: 11px var(--mono); color: var(--ink-faint); }
  .log-controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

  .warn-row { font: 11px var(--mono); color: var(--warn); padding: 3px 0; border-bottom: 1px solid #262a38; }
  .legend { font: 10px var(--mono); color: var(--ink-faint); margin-top: 8px; line-height: 1.7; }
  .summary-row { font: 11px var(--mono); color: var(--ink-dim); padding: 2px 0; }
  .offline { color: var(--warn); }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>Ride The Bus — math build</h1>
    <span class="state-pill" id="pill">connecting</span>
    <div class="facts">
      <span><b id="f-modes">—</b> modes</span>
      <span><b id="f-sims">—</b> simulations</span>
      <span><b id="f-threads">—</b> workers</span>
      <span>elapsed <b id="f-elapsed">—</b></span>
    </div>
  </div>
  <div class="overall">
    <div class="bar" id="overall-bar"><i></i></div>
    <span class="pct" id="overall-pct">0%</span>
    <span class="eta" id="overall-eta">estimating…</span>
  </div>
</header>

<main>
  <div>
    <section>
      <h2>Passes</h2>
      <div id="stages"></div>
    </section>
    <section>
      <h2>Bet modes</h2>
      <div id="families"></div>
      <div class="legend">
        slug: <b>R</b>/<b>B</b> colour · <b>↑</b> higher <b>↓</b> lower <b>=</b> equal · <b>&gt;&lt;</b> inside
        <b>&lt;&gt;</b> outside · suit · bars: simulate / reweight / verify / scan
      </div>
    </section>
  </div>

  <div class="side">
    <section>
      <h2>Workers</h2>
      <div class="workers" id="workers"></div>
    </section>
    <section id="warn-section" style="display:none">
      <h2>Warnings</h2>
      <div id="warnings"></div>
    </section>
    <section id="summary-section" style="display:none">
      <h2>Produced</h2>
      <div id="summary"></div>
    </section>
    <section>
      <h2>Output</h2>
      <div class="log-controls">
        <label><input type="checkbox" id="follow" checked /> follow</label>
        <label><input type="checkbox" id="only-steps" /> steps only</label>
        <span id="log-count"></span>
      </div>
      <div class="log-wrap" id="log"></div>
    </section>
  </div>
</main>

<script>
  const FAMILY_LABEL = { sc: 'Second Chance', base: 'Classic', hs: 'High Stakes', tr: 'Three of a Kind' };
  const FAMILY_ORDER = ['sc', 'base', 'hs', 'tr'];
  const TOKEN = {
    red: 'R', black: 'B', higher: '↑', lower: '↓', equal: '=', inside: '><', outside: '<>',
    heart: '♥', diamond: '♦', club: '♣', spade: '♠', any: '·',
  };
  const STAGE_KEYS = ['simulate', 'publish', 'verify', 'scan'];
  // The three a mode passes through on its own. The scan is a single pass over
  // every mode at the end, so it says nothing about one mode's progress.
  const MODE_STAGE_KEYS = ['simulate', 'publish', 'verify'];
  // A mode that warned is finished, and its box is already red: counting it as
  // incomplete would leave a family reading 63/64 forever over a known figure.
  const settled = (record) => record.state === 'done' || record.state === 'warn';

  let cursor = 0;
  let logEntries = [];
  const el = (id) => document.getElementById(id);

  const fmtInt = (n) => (n == null ? '—' : Math.round(n).toLocaleString());
  function fmtDuration(seconds) {
    if (seconds == null || !isFinite(seconds)) return '—';
    const s = Math.max(0, Math.round(seconds));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
    if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
    return `${sec}s`;
  }
  /** "hs_red_higher_inside_heart" -> "R ↑ >< ♥", which fits a 128px box. */
  function slugTokens(name) {
    const parts = name.split('_');
    if (['sc', 'hs', 'tr'].includes(parts[0])) parts.shift();
    return parts.map((p) => TOKEN[p] || p).join(' ');
  }

  function stageClass(record) {
    if (!record) return '';
    return record.state === 'warn' ? 'warn' : record.state === 'done' ? 'done' : record.state === 'running' ? 'running' : '';
  }

  function renderStages(data) {
    const host = el('stages');
    host.innerHTML = '';
    for (const id of data.stageOrder) {
      const st = data.stages[id];
      const pct = st.total > 0 ? Math.min(100, (st.done / st.total) * 100) : st.state === 'done' ? 100 : 0;
      const row = document.createElement('div');
      row.className = `stage ${st.state}`;
      const count = st.unit === 'sims'
        ? `${fmtInt(st.done)} / ${fmtInt(st.total)}`
        : `${fmtInt(st.done)} / ${fmtInt(st.total)} modes`;
      row.innerHTML = `
        <div class="name">${st.label}<small>${st.note || st.hint}</small></div>
        <div class="bar ${st.state === 'done' ? 'done' : ''}"><i style="width:${pct}%"></i></div>
        <div class="count">${st.total ? count : ''}</div>
        <div class="stage-eta">${st.state === 'done' ? fmtDuration(st.elapsed) + ' taken' : st.eta != null ? fmtDuration(st.eta) + ' left' : ''}</div>`;
      host.appendChild(row);
    }
  }

  function renderWorkers(data) {
    const host = el('workers');
    host.innerHTML = '';
    if (!data.workers.length) {
      host.innerHTML = '<div class="log-line">no workers yet</div>';
      return;
    }
    for (const w of data.workers) {
      const box = document.createElement('div');
      box.className = `worker ${w.state}`;
      const value = w.state === 'running' ? 'running' : w.rtp != null ? `${w.rtp.toFixed(3)} RTP` : 'idle';
      box.innerHTML = `<span class="w-id">worker ${w.index}</span><span class="w-val">${value}</span>`;
      box.title = w.mode ? `${w.mode}` : '';
      host.appendChild(box);
    }
  }

  function renderModes(data) {
    const host = el('families');
    const groups = new Map();
    for (const mode of data.modes) {
      if (!groups.has(mode.family)) groups.set(mode.family, []);
      groups.get(mode.family).push(mode);
    }
    host.innerHTML = '';
    const ordered = [...groups.entries()].sort(
      (a, b) => (FAMILY_ORDER.indexOf(a[0]) + 1 || 99) - (FAMILY_ORDER.indexOf(b[0]) + 1 || 99),
    );
    for (const [family, modes] of ordered) {
      // Two counts, not one: "complete" only moves in the last minutes of a
      // forty-minute build, and the first pass is the one being watched.
      const simCount = modes.filter((m) => settled(m.simulate)).length;
      const verifiedCount = modes.filter((m) => settled(m.verify)).length;
      const wrap = document.createElement('div');
      wrap.className = 'family';
      const head = document.createElement('div');
      head.className = 'family-head';
      head.innerHTML = `
        <span class="dot" style="background: var(--${family})"></span>
        <h3>${FAMILY_LABEL[family] || family}</h3>
        <span class="tally">${simCount}/${modes.length} simulated · ${verifiedCount}/${modes.length} verified · ${fmtInt(modes.reduce((n, m) => n + m.sims, 0))} sims</span>`;
      wrap.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const mode of modes) {
        const box = document.createElement('div');
        const anyRunning = STAGE_KEYS.some((k) => mode[k].state === 'running');
        const allDone = MODE_STAGE_KEYS.every((k) => settled(mode[k]));
        const warned = mode.warnings.length > 0;
        box.className = `mode${anyRunning ? ' active' : ''}${allDone ? ' finished' : ''}${warned ? ' warn' : ''}`;
        const rtp = mode.publish.rtp != null ? (mode.publish.rtp * 100).toFixed(2) + '%' : '';
        const batch = mode.simulate.batches ? `${mode.simulate.batch}/${mode.simulate.batches}` : '';
        box.innerHTML = `
          <div class="slug" style="color:${allDone ? '' : ''}">${slugTokens(mode.name)}</div>
          <div class="meta"><span>${mode.sims ? (mode.sims / 1000) + 'k' : ''}</span><span>${rtp}</span></div>
          <div class="steps">
            ${STAGE_KEYS.map((k) => `<i class="${stageClass(mode[k])}"></i>`).join('')}
          </div>
          <div class="now">${mode.step ? mode.step + (batch ? ' ' + batch : '') : ''}</div>`;
        box.title = [
          mode.name,
          mode.sims ? `${mode.sims.toLocaleString()} simulations` : '',
          mode.simulate.ms ? `simulated in ${(mode.simulate.ms / 1000).toFixed(1)}s` : '',
          mode.simulate.threads.length ? `worker RTP ${mode.simulate.threads.map((t) => t.rtp).join(', ')}` : '',
          mode.verify.note ? `verify: ${mode.verify.note}` : '',
          ...mode.warnings,
        ].filter(Boolean).join('\n');
        grid.appendChild(box);
      }
      wrap.appendChild(grid);
      host.appendChild(wrap);
    }
    if (!data.modes.length) host.innerHTML = '<div class="log-line">waiting for the build to announce its modes…</div>';
  }

  function renderLog() {
    const wrap = el('log');
    const stepsOnly = el('only-steps').checked;
    const shown = stepsOnly ? logEntries.filter((e) => e.k !== 'out' && e.k !== 'thread') : logEntries;
    const tail = shown.slice(-800);
    wrap.innerHTML = tail.map((e) => `<div class="log-line ${e.k}">${escapeHtml(e.s)}</div>`).join('');
    el('log-count').textContent = `${logEntries.length} lines`;
    if (el('follow').checked) wrap.scrollTop = wrap.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  function renderSide(data) {
    const warnHost = el('warnings');
    el('warn-section').style.display = data.warnings.length ? '' : 'none';
    warnHost.innerHTML = data.warnings
      .map((w) => `<div class="warn-row">${escapeHtml(w.mode || '?')} — ${escapeHtml(w.metric)} ${escapeHtml(w.value)} &gt; ${escapeHtml(w.limit)}</div>`)
      .join('');
    el('summary-section').style.display = data.summary.length ? '' : 'none';
    el('summary').innerHTML = data.summary.map((s) => `<div class="summary-row">${escapeHtml(s)}</div>`).join('');
  }

  function render(data) {
    const pill = el('pill');
    if (data.build.finished) {
      const ok = data.build.exitCode === 0;
      pill.textContent = ok ? 'finished' : `exit ${data.build.exitCode}`;
      pill.className = `state-pill ${ok ? 'done' : 'failed'}`;
    } else {
      pill.textContent = 'building';
      pill.className = 'state-pill';
    }
    el('f-modes').textContent = fmtInt(data.build.modeCount);
    el('f-sims').textContent = fmtInt(data.build.totalSims);
    el('f-threads').textContent = data.build.threads || '—';
    el('f-elapsed').textContent = fmtDuration(data.build.elapsed);

    const pct = data.build.progress * 100;
    el('overall-bar').querySelector('i').style.width = pct.toFixed(1) + '%';
    el('overall-bar').classList.toggle('done', !!data.build.finished && data.build.exitCode === 0);
    el('overall-pct').textContent = pct.toFixed(1) + '%';
    el('overall-eta').textContent = data.build.finished
      ? `done in ${fmtDuration(data.build.elapsed)}${data.build.linger != null ? ` · page closes in ${fmtDuration(data.build.linger)}` : ''}`
      : data.build.eta != null
        ? `about ${fmtDuration(data.build.eta)} left`
        : 'estimating…';

    renderStages(data);
    renderWorkers(data);
    renderModes(data);
    renderSide(data);
    document.title = data.build.finished
      ? 'Build finished — Ride The Bus'
      : `${pct.toFixed(0)}% — Ride The Bus math build`;
  }

  async function poll() {
    try {
      const res = await fetch(`/state?log=${cursor}`, { cache: 'no-store' });
      const data = await res.json();
      if (data.log && data.log.length) {
        logEntries = logEntries.concat(data.log);
        if (logEntries.length > 6000) logEntries = logEntries.slice(-6000);
      }
      cursor = data.logCursor;
      render(data);
      renderLog();
    } catch (err) {
      el('pill').textContent = 'monitor closed';
      el('pill').className = 'state-pill failed';
    }
  }

  el('only-steps').addEventListener('change', renderLog);
  poll();
  setInterval(poll, 500);
</script>
</body>
</html>
